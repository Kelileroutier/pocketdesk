<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocketdesk 2.0</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
}

header{
background:#111827;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #374151;
}

.logo{
font-size:24px;
font-weight:bold;
color:#38bdf8;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input, textarea, select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border:none;
border-radius:8px;
background:#334155;
color:white;
}

button{
background:#38bdf8;
color:black;
font-weight:bold;
border:none;
padding:12px 16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.hidden{
display:none;
}

.ticket{
background:#334155;
padding:15px;
border-radius:10px;
margin-top:10px;
}

.badge{
background:#22c55e;
padding:4px 8px;
border-radius:8px;
font-size:12px;
}

.title{
font-size:22px;
margin-bottom:15px;
}
</style>
</head>

<body>

<header>
<div class="logo">Pocketdesk 2.0</div>
<button onclick="showSupportLogin()">
Support Login
</button>
</header>

<div class="container">

<div class="card">
<h2 class="title">Ticket erstellen</h2>

<input type="text" id="customerName" placeholder="Dein Name">

<input type="text" id="subject" placeholder="Betreff">

<textarea
id="message"
rows="5"
placeholder="Beschreibe dein Problem">
</textarea>

<button onclick="createTicket()">
Ticket erstellen
</button>

<div id="result"></div>

</div>

<div class="card">
<h2 class="title">
Ticket suchen
</h2>

<input id="searchTicket"
placeholder="Ticketnummer eingeben">

<button onclick="findTicket()">
Suchen
</button>

<div id="ticketResult"></div>

</div>

<div
id="supportPanel"
class="card hidden">

<h2 class="title">
Support Dashboard
</h2>

<div id="allTickets"></div>

</div>

</div>

<script>

const SUPPORT_USER = "support";
const SUPPORT_PASS = "Keli2026!Support#";

let tickets =
JSON.parse(
localStorage.getItem("tickets")
|| "[]"
);

function saveTickets(){
localStorage.setItem(
"tickets",
JSON.stringify(tickets)
);
}

function generateTicketId(){
return "PD-" +
Math.floor(
100000 + Math.random()*900000
);
}

function createTicket(){

let customer =
document.getElementById(
"customerName"
).value;

let subject =
document.getElementById(
"subject"
).value;

let message =
document.getElementById(
"message"
).value;

if(!customer || !subject || !message){
alert("Bitte alle Felder ausfüllen.");
return;
}

let id = generateTicketId();

let ticket = {
id:id,
customer:customer,
subject:subject,
message:message,
status:"Offen",
date:new Date().toLocaleString()
};

tickets.push(ticket);

saveTickets();

document.getElementById(
"result"
).innerHTML = `
<div class="ticket">
<h3>Ticket erstellt</h3>
<p><b>Ticketnummer:</b> ${id}</p>
</div>
`;

loadTickets();
}

function findTicket(){

let id =
document.getElementById(
"searchTicket"
).value;

let ticket =
tickets.find(
t=>t.id===id
);

if(!ticket){
document.getElementById(
"ticketResult"
).innerHTML =
"Ticket nicht gefunden";
return;
}

document.getElementById(
"ticketResult"
).innerHTML = `
<div class="ticket">
<h3>${ticket.subject}</h3>
<p>${ticket.message}</p>
<p>Status:
<span class="badge">
${ticket.status}
</span></p>
</div>
`;

}

function showSupportLogin(){

let user =
prompt("Benutzername");

if(user!==SUPPORT_USER){
alert("Ungültiger Benutzer.");
return;
}

let pass =
prompt("Passwort");

if(pass!==SUPPORT_PASS){
alert("Falsches Passwort.");
return;
}

document
.getElementById(
"supportPanel"
)
.classList
.remove("hidden");

loadTickets();

}

function loadTickets(){

let html="";

tickets.forEach(ticket=>{

html+=`
<div class="ticket">
<h3>${ticket.id}</h3>
<p><b>Kunde:</b>
${ticket.customer}</p>

<p><b>Betreff:</b>
${ticket.subject}</p>

<p>
${ticket.message}
</p>

<p>
Status:
${ticket.status}
</p>
</div>
`;

});

document.getElementById(
"allTickets"
).innerHTML = html;

}

</script>


</body>
</html>
